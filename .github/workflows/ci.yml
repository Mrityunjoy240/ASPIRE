name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    # No secrets required: DATABASE_URL is a dummy value so Settings() can be
    # built at import; the NullPool engine never connects during tests or
    # contract generation (real DB stack is OQ-A02).
    env:
      DATABASE_URL: postgresql+psycopg://ci:ci@127.0.0.1:5432/aspire_ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: python -m pip install -e ".[dev]"

      - run: python -m pytest tests/ -q

      - name: OpenAPI contract drift (DM-API01)
        run: |
          python scripts/generate_openapi.py
          git diff --exit-code contracts/openapi.json